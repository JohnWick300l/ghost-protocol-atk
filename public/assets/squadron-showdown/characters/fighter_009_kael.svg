<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="voltCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Subtle Ground Shadow -->
  <ellipse cx="300" cy="855" rx="145" ry="20" fill="rgba(56,189,248,0.22)"/>

  <!-- Electric Aura Arcs -->
  <path d="M150 420 L120 390 L145 360 L115 330" stroke="#38bdf8" stroke-width="4" fill="none" filter="url(#neonGlow)" opacity="0.8"/>
  <path d="M455 380 L485 350 L460 320 L490 285" stroke="#38bdf8" stroke-width="4" fill="none" filter="url(#neonGlow)" opacity="0.8"/>

  <!-- Left Leg (Back stance) -->
  <path d="M250 490 L195 660 L175 810 L235 815 L265 675 L305 510 Z" fill="url(#suitGrad)" stroke="#050811" stroke-width="6"/>
  <!-- Left Knee Pad & Cyan Trim -->
  <polygon points="195,635 245,640 238,690 188,685" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <path d="M235 530 L205 630" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Leg (Forward stance) -->
  <path d="M315 490 L375 650 L405 810 L345 815 L315 670 L280 510 Z" fill="url(#suitGrad)" stroke="#050811" stroke-width="6"/>
  <!-- Right Knee Slider Armor -->
  <polygon points="335,630 385,625 395,680 342,685" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <path d="M340 525 L370 620" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Left Racing Boot -->
  <path d="M172 795 L235 800 L242 848 L145 852 C140 830 155 810 172 795 Z" fill="#0f172a" stroke="#050811" stroke-width="6"/>
  <path d="M150 842 L238 842" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="180,805 225,808 220,828 175,825" fill="url(#voltCyan)"/>

  <!-- Right Racing Boot -->
  <path d="M345 800 L408 795 C425 810 442 830 438 852 L340 848 Z" fill="#0f172a" stroke="#050811" stroke-width="6"/>
  <path d="M344 842 L434 842" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="355,808 400,805 405,825 360,828" fill="url(#voltCyan)"/>

  <!-- Torso / Armored Racing Jacket -->
  <path d="M210 245 L390 245 L360 495 L240 495 Z" fill="url(#suitGrad)" stroke="#050811" stroke-width="7"/>
  <!-- Chest V-Core Plate -->
  <polygon points="235,265 365,265 340,385 300,415 260,385" fill="#111827" stroke="#38bdf8" stroke-width="4"/>
  <!-- Glowing UV Volt Emblem -->
  <polygon points="275,295 325,295 300,355" fill="none" stroke="#38bdf8" stroke-width="6" filter="url(#neonGlow)"/>
  <polygon points="287,305 313,305 300,335" fill="#e0f2fe"/>
  <!-- Abdominal Armor Segments -->
  <rect x="262" y="422" width="76" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="266" y="450" width="68" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <!-- Utility Belt -->
  <rect x="235" y="478" width="130" height="24" rx="5" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
  <rect x="285" y="475" width="30" height="30" rx="4" fill="url(#voltCyan)"/>

  <!-- Left Arm (Raised Guard Fist) -->
  <path d="M215 255 L145 335 L185 415 L235 350 Z" fill="url(#suitGrad)" stroke="#050811" stroke-width="6"/>
  <!-- Left Shoulder Pauldron -->
  <path d="M180 235 C200 220 230 230 235 265 L175 290 C165 265 170 245 180 235 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="5"/>
  <!-- Left Forearm & Gauntlet -->
  <path d="M150 345 L215 295 L245 335 L185 395 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <!-- Left Electric Fist -->
  <rect x="205" y="272" width="52" height="46" rx="12" fill="#0284c7" stroke="#e0f2fe" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Right Arm (Charged Strike Ready) -->
  <path d="M385 255 L455 340 L415 415 L365 350 Z" fill="url(#suitGrad)" stroke="#050811" stroke-width="6"/>
  <!-- Right Shoulder Pauldron -->
  <path d="M420 235 C400 220 370 230 365 265 L425 290 C435 265 430 245 420 235 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="5"/>
  <!-- Right Forearm & Gauntlet -->
  <path d="M445 345 L385 295 L355 335 L415 395 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <!-- Right Electric Fist -->
  <rect x="345" y="272" width="52" height="46" rx="12" fill="#0284c7" stroke="#e0f2fe" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Aero Racing Helmet & Head -->
  <path d="M240 155 C240 95 360 95 360 155 L368 215 C368 238 335 252 300 252 C265 252 232 238 232 215 Z" fill="#0f172a" stroke="#050811" stroke-width="7"/>
  <!-- Helmet Cyan Aero Stripes -->
  <path d="M270 112 L300 145 L330 112" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <!-- Illuminated Cyber Visor -->
  <path d="M245 162 L355 162 L345 204 L300 214 L255 204 Z" fill="url(#visorGlow)" stroke="#e0f2fe" stroke-width="3" filter="url(#neonGlow)"/>
  <!-- Chin Guard Vent -->
  <polygon points="282,225 318,225 312,242 288,242" fill="#38bdf8"/>
</svg>
