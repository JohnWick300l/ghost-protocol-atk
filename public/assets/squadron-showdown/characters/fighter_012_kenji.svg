<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="driftSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="plasmaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="855" rx="140" ry="18" fill="rgba(16,185,129,0.24)"/>

  <!-- Plasma Drift Speed Lines -->
  <path d="M120 520 L185 480 M480 420 L420 385" stroke="#34d399" stroke-width="5" stroke-linecap="round" filter="url(#emeraldGlow)"/>

  <!-- Left Leg -->
  <path d="M250 485 L192 655 L170 810 L228 815 L262 670 L300 505 Z" fill="url(#driftSuit)" stroke="#04130f" stroke-width="6"/>
  <polygon points="188,632 238,638 232,688 182,682" fill="#0f172a" stroke="#34d399" stroke-width="4"/>

  <!-- Right Leg -->
  <path d="M315 485 L378 650 L410 810 L350 815 L318 670 L285 505 Z" fill="url(#driftSuit)" stroke="#04130f" stroke-width="6"/>
  <polygon points="340,632 390,628 398,682 346,688" fill="#0f172a" stroke="#34d399" stroke-width="4"/>

  <!-- Boots -->
  <path d="M166 796 L230 800 L236 848 L142 852 C138 828 152 810 166 796 Z" fill="#0f172a" stroke="#04130f" stroke-width="6"/>
  <path d="M146 842 L232 842" stroke="#34d399" stroke-width="6"/>

  <path d="M348 800 L414 796 C428 810 442 828 438 852 L344 848 Z" fill="#0f172a" stroke="#04130f" stroke-width="6"/>
  <path d="M348 842 L434 842" stroke="#34d399" stroke-width="6"/>

  <!-- Cyber-Ninja Biker Jacket -->
  <path d="M215 240 L385 240 L352 490 L248 490 Z" fill="url(#driftSuit)" stroke="#04130f" stroke-width="7"/>
  <!-- Diagonal Tactical Harness -->
  <polygon points="235,255 365,255 340,390 300,415 260,390" fill="#09151e" stroke="#34d399" stroke-width="4"/>
  <path d="M242 260 L350 400 M358 260 L250 400" stroke="#10b981" stroke-width="6"/>
  <circle cx="300" cy="330" r="24" fill="url(#plasmaGreen)" stroke="#ecfdf5" stroke-width="3" filter="url(#emeraldGlow)"/>

  <!-- Belt & Trailing Cyber Scarf -->
  <rect x="242" y="472" width="116" height="22" rx="5" fill="#04130f" stroke="#34d399" stroke-width="3"/>

  <!-- Left Arm -->
  <path d="M218 252 L152 330 L188 405 L238 345 Z" fill="url(#driftSuit)" stroke="#04130f" stroke-width="6"/>
  <polygon points="175,235 228,245 215,292 162,282" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <rect x="198" y="275" width="48" height="44" rx="10" fill="url(#plasmaGreen)" stroke="#ecfdf5" stroke-width="3" filter="url(#emeraldGlow)"/>

  <!-- Right Arm -->
  <path d="M382 252 L448 330 L412 405 L362 345 Z" fill="url(#driftSuit)" stroke="#04130f" stroke-width="6"/>
  <polygon points="425,235 372,245 385,292 438,282" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <rect x="354" y="275" width="48" height="44" rx="10" fill="url(#plasmaGreen)" stroke="#ecfdf5" stroke-width="3" filter="url(#emeraldGlow)"/>

  <!-- Sleek Stealth Helmet -->
  <path d="M242 152 C242 96 358 96 358 152 L364 212 C364 235 334 248 300 248 C266 248 236 235 236 212 Z" fill="#09151e" stroke="#04130f" stroke-width="7"/>
  <!-- Dual Horn Aero Fins -->
  <polygon points="245,130 225,95 268,115" fill="url(#plasmaGreen)"/>
  <polygon points="355,130 375,95 332,115" fill="url(#plasmaGreen)"/>
  <!-- Emerald Slit Visor -->
  <polygon points="248,162 352,162 342,196 300,208 258,196" fill="url(#plasmaGreen)" stroke="#ecfdf5" stroke-width="3" filter="url(#emeraldGlow)"/>
</svg>
