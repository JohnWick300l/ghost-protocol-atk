<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Map Pin Shield Contour in Pure White -->
  <path d="M 256 32 C 140 32 64 120 64 230 C 64 330 180 430 256 480 C 332 430 448 330 448 230 C 448 120 372 32 256 32 Z" 
        fill="#090D16" stroke="#FFFFFF" stroke-width="16" filter="url(#whiteGlow)" />

  <!-- Outer Rounded Socket Plate Ring -->
  <rect x="140" y="96" width="232" height="256" rx="36" fill="#121824" stroke="#FFFFFF" stroke-width="10" />

  <!-- Main Circular 3-Pin Socket Outlet Receptacle -->
  <circle cx="256" cy="224" r="72" fill="#05080E" stroke="#FFFFFF" stroke-width="8" />

  <!-- 3 Classic Round Power Socket Receptacle Holes (Pure White) -->
  <!-- Top Earth Pin Hole (larger) -->
  <circle cx="256" cy="180" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Bottom Left Live Pin Hole -->
  <circle cx="214" cy="248" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Bottom Right Neutral Pin Hole -->
  <circle cx="298" cy="248" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- White Lightning Bolt Badge below socket faceplate -->
  <path d="M 256 296 L 234 326 L 254 326 L 244 356 L 278 316 L 258 316 Z" fill="#FFFFFF" />
</svg>