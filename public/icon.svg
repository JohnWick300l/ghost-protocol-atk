<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#FF3B1F" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed dark avionics background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle outer tactical hex bezel -->
  <circle cx="256" cy="242" r="176" fill="none" stroke="#1E293B" stroke-width="10" />
  <circle cx="256" cy="242" r="158" fill="none" stroke="url(#ringCyan)" stroke-width="5" opacity="0.92" />
  <circle cx="256" cy="242" r="134" fill="#060A11" stroke="#1E293B" stroke-width="2.5" />

  <!-- Cardinal red/orange HUD reticle ticks (matching Cockpit center reticle) -->
  <g stroke="#FF3B1F" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)">
    <line x1="256" y1="86" x2="256" y2="132" />
    <line x1="256" y1="352" x2="256" y2="398" />
    <line x1="100" y1="242" x2="146" y2="242" />
    <line x1="366" y1="242" x2="412" y2="242" />
  </g>

  <!-- Diagonal cyan HUD ticks -->
  <g stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="158" y1="144" x2="178" y2="164" />
    <line x1="354" y1="144" x2="334" y2="164" />
    <line x1="158" y1="340" x2="178" y2="320" />
    <line x1="354" y1="340" x2="334" y2="320" />
  </g>

  <!-- Center Stealth Delta Wing / Fighter Reticle Emblem -->
  <path
    d="M174 202 L256 226 L338 202 L256 322 Z"
    fill="url(#wingGrad)"
    filter="url(#neonGlow)"
  />
  <path
    d="M214 226 L256 239 L298 226 L256 286 Z"
    fill="#090D16"
  />

  <!-- Top Crimson Accent Stripes -->
  <path d="M312 438 L328 414 L340 414 L324 438 Z" fill="#FF3B1F" />
  <path d="M328 438 L344 414 L356 414 L340 438 Z" fill="#FF3B1F" />

  <!-- GHOST PROTOCOL Wordmark -->
  <text
    x="240"
    y="440"
    text-anchor="middle"
    fill="#F8FAFC"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-style="italic"
    font-size="34"
    letter-spacing="4"
  >GHOST</text>
  <text
    x="256"
    y="468"
    text-anchor="middle"
    fill="#38BDF8"
    font-family="JetBrains Mono, monospace"
    font-weight="700"
    font-size="16"
    letter-spacing="9"
  >PROTOCOL</text>
</svg>
